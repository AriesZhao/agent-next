[project]
name = "mock-server"
version = "0.1.0"
description = "Mock business API & MCP server for AriesAgent development & testing"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.scripts]
mock-server = "mock_server.main:cli_entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mock_server"]
